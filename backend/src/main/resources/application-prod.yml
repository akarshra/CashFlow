spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cashflow_db
    username: cashflow_admin
    password: enterprise_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8443
  # SSL configuration (provide your keystore in production)
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: tomcat

# Configure allowed CORS origins for production (comma-separated)
app:
  cors:
    allowed-origins: "https://your-frontend-domain.com,https://admin.your-frontend-domain.com"

gemini:
  api-url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent"
  api-key: ${GEMINI_API_KEY}
